<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circuit pattern -->
  <g fill="none" stroke="url(#logoGradient)" strokeWidth="2" strokeLinecap="round">
    <!-- Central branching structure -->
    <path d="M50,20 L50,35 M50,35 L35,50 M50,35 L65,50 M35,50 L35,65 M65,50 L65,65" />
    <path d="M35,65 L20,80 M65,65 L80,80" />
    <path d="M50,35 L50,50 M50,50 L40,60 M50,50 L60,60" />
    
    <!-- Connection nodes -->
    <circle cx="50" cy="20" r="3" fill="#00D4FF" />
    <circle cx="50" cy="35" r="4" fill="#4F46E5" />
    <circle cx="35" cy="50" r="3" fill="#06B6D4" />
    <circle cx="65" cy="50" r="3" fill="#06B6D4" />
    <circle cx="35" cy="65" r="3" fill="#00D4FF" />
    <circle cx="65" cy="65" r="3" fill="#00D4FF" />
    <circle cx="20" cy="80" r="3" fill="#4F46E5" />
    <circle cx="80" cy="80" r="3" fill="#4F46E5" />
    <circle cx="50" cy="50" r="3" fill="#00D4FF" />
    <circle cx="40" cy="60" r="2" fill="#06B6D4" />
    <circle cx="60" cy="60" r="2" fill="#06B6D4" />
    
    <!-- Additional circuit elements -->
    <path d="M25,25 L30,30 M70,25 L75,30" stroke="#00D4FF" strokeWidth="1.5"/>
    <circle cx="25" cy="25" r="2" fill="#00D4FF" />
    <circle cx="30" cy="30" r="2" fill="#06B6D4" />
    <circle cx="70" cy="25" r="2" fill="#00D4FF" />
    <circle cx="75" cy="30" r="2" fill="#06B6D4" />
  </g>
  
  <!-- Curved accent element -->
  <path d="M75,60 Q85,70 75,80" fill="none" stroke="url(#logoGradient)" strokeWidth="3" strokeLinecap="round" opacity="0.8"/>
  <path d="M25,40 Q15,30 25,20" fill="none" stroke="url(#logoGradient)" strokeWidth="3" strokeLinecap="round" opacity="0.8"/>
</svg>